[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-context"
version = "0.1.0"
description = "Local-first conversation archives, editable Markdown memory, and MCP"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
portable-context = "portable_context.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
