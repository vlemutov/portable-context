[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-context"
version = "0.9.0"
description = "Agent-driven conversation import, provenance graphs, and shared Markdown knowledge via MCP"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
backup = ["boto3>=1.35,<2"]

[project.scripts]
portable-context = "portable_context.cli:main"
portable-context-client = "portable_context.client:main"

[tool.setuptools.packages.find]
where = ["src"]
