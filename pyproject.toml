[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-context"
version = "0.2.0"
description = "Agent-driven conversation import, provenance graphs, and shared Markdown knowledge via MCP"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
portable-context = "portable_context.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
