name: gateway
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mtls:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[deployment]'
      - run: python deploy/edge_tools.py caddy --directory '${{ runner.temp }}/pc-edge-tools' --ci
      - run: python -m unittest discover -s tests -p test_gateway.py -v
  oauth-recovery:
    strategy:
      fail-fast: false
      matrix:
        scenario: [recovery, rotation, installer]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[mcp,deployment]'
      - run: python deploy/edge_tools.py caddy --directory '${{ runner.temp }}/pc-edge-tools' --ci
      - run: python deploy/restic_tools.py --ci
      - name: Fetch and verify pinned identity provider
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, sys, urllib.request
          sys.path.insert(0, 'deploy')
          from pocketid import VERSION, LINUX_AMD64_SHA256
          url = f'https://github.com/pocket-id/pocket-id/releases/download/v{VERSION}/pocket-id_linux_amd64'
          with urllib.request.urlopen(url, timeout=120) as response:
              data = response.read()
          assert hashlib.sha256(data).hexdigest() == LINUX_AMD64_SHA256
          path = pathlib.Path(os.environ['RUNNER_TEMP'])/'pocket-id'
          path.write_bytes(data)
          path.chmod(0o700)
          PY
      - name: Recover older snapshot without reviving credentials
        if: matrix.scenario == 'recovery'
        run: python deploy/smoke_oauth_recovery.py --provider "$RUNNER_TEMP/pocket-id" --caddy "$PC_TEST_CADDY" --restic "$PC_TEST_RESTIC"
      - name: Start isolated runner user service manager
        run: |
          if [ '${{ matrix.scenario }}' != 'installer' ]; then
            sudo loginctl enable-linger "$(id -un)"
          fi
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Restore complete disposable installation and reconnect over HTTPS
        if: matrix.scenario == 'recovery'
        run: python deploy/smoke_recovery_installation.py --provider "$RUNNER_TEMP/pocket-id" --caddy "$PC_TEST_CADDY" --restic "$PC_TEST_RESTIC"
      - name: Rotate mTLS while killing the controller at every stage
        if: matrix.scenario == 'rotation'
        run: python deploy/smoke_gateway_rotation.py --caddy "$PC_TEST_CADDY"
      - name: Install HTTPS and resume a killed package update
        if: matrix.scenario == 'installer'
        run: python deploy/smoke_https_install.py --provider "$RUNNER_TEMP/pocket-id" --caddy "$PC_TEST_CADDY" --restic "$PC_TEST_RESTIC"
