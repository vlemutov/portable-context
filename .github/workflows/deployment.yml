name: deployment
on: [push, pull_request]
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap pinned tools and validate provider schema
        if: matrix.os != 'ubuntu-24.04'
        run: python deploy/validate_client.py
      - name: Validate Terraform and boot the provisioned Ubuntu cloud image twice
        if: matrix.os == 'ubuntu-24.04'
        timeout-minutes: 20
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
          python -m pip install -e '.[deployment]' pexpect
          cd "$RUNNER_TEMP"
          base=https://cloud-images.ubuntu.com/noble/current
          img=noble-server-cloudimg-amd64.img
          curl -fsS --retry 3 -O "$base/$img"
          curl -fsS --retry 3 -O "$base/SHA256SUMS"
          grep -E " [*]?$img$" SHA256SUMS | sha256sum -c -
          if test -e /dev/kvm; then sudo setfacl -m "u:$(id -un):rw" /dev/kvm; fi
          cd "$GITHUB_WORKSPACE"
          python deploy/validate_client.py --guest-image "$RUNNER_TEMP/$img"
      - name: Exercise actual host route lifecycle (Windows)
        if: runner.os == 'Windows'
        run: python deploy/smoke_network.py
      - name: Exercise actual host route lifecycle (macOS and Linux)
        if: runner.os != 'Windows'
        run: sudo env CI=true "$(command -v python)" deploy/smoke_network.py
  ssh-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare disposable SSH target
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server python3-venv cron
          sudo useradd -m -s /bin/bash pcsmoke
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/pc-smoke-key"
          sudo install -d -m 700 -o pcsmoke -g pcsmoke /home/pcsmoke/.ssh
          sudo install -m 600 -o pcsmoke -g pcsmoke "$RUNNER_TEMP/pc-smoke-key.pub" /home/pcsmoke/.ssh/authorized_keys
          sudo service ssh start
          sudo service cron start
          python -m pip install -e '.[mcp]'
      - name: Install, exercise MCP over SSH, reinstall and restore
        env:
          PC_SMOKE_USER: pcsmoke
        run: |
          export PC_SMOKE_KEY="$RUNNER_TEMP/pc-smoke-key"
          python deploy/smoke_ssh.py
