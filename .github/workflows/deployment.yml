name: deployment
on: [push, pull_request]
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap pinned tools and validate provider schema
        run: python deploy/validate_client.py
      - name: Exercise actual host route lifecycle (Windows)
        if: runner.os == 'Windows'
        run: python deploy/smoke_network.py
      - name: Exercise actual host route lifecycle (macOS and Linux)
        if: runner.os != 'Windows'
        run: sudo env CI=true "$(command -v python)" deploy/smoke_network.py
  ssh-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare disposable SSH target
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server python3-venv cron
          sudo useradd -m -s /bin/bash pcsmoke
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/pc-smoke-key"
          sudo install -d -m 700 -o pcsmoke -g pcsmoke /home/pcsmoke/.ssh
          sudo install -m 600 -o pcsmoke -g pcsmoke "$RUNNER_TEMP/pc-smoke-key.pub" /home/pcsmoke/.ssh/authorized_keys
          sudo service ssh start
          sudo service cron start
          python -m pip install -e '.[mcp]'
      - name: Install, exercise MCP over SSH, reinstall and restore
        env:
          PC_SMOKE_USER: pcsmoke
        run: |
          export PC_SMOKE_KEY="$RUNNER_TEMP/pc-smoke-key"
          python deploy/smoke_ssh.py
